name: artisan_marketplace
description: A Flutter mobile app for an Artisan Service Marketplace
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Backend & Database
  supabase_flutter: ^2.5.4

  # Routing
  go_router: ^12.1.3

  # Forms & Validation
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0

  # Bottom Navigation
  convex_bottom_bar: ^3.0.0

  # Image Picker
  image_picker: ^1.0.7

  # Notifications
  # firebase_core: ^2.24.2  # Uncomment when Firebase is configured
  # firebase_messaging: ^14.7.10  # Uncomment when Firebase is configured
  flutter_local_notifications: ^19.0.0

  # Charts
  fl_chart: ^0.66.0

  # UI & Utilities
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  path: ^1.9.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.4

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/images/avatars/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
